name: release-please

on:
  push:
    branches: [master]
  # Manual escape hatch: GitHub occasionally drops default-branch push events (observed
  # 2026-07-19 — merges landed with zero check suites), which silently skips the release roll.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  # Runs only when the release PR is merged and the tag/release were just created.
  # (Kept in this workflow because tags pushed with GITHUB_TOKEN don't trigger others.)
  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test release commit
        run: dotnet test CalCrony.slnx -c Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          build_and_push() {
            local dockerfile="$1" image="ghcr.io/${OWNER}/$2"
            docker build --build-arg VERSION="${VERSION}" -f "${dockerfile}" \
              -t "${image}:${VERSION}" -t "${image}:latest" .
            docker push "${image}:${VERSION}"
            docker push "${image}:latest"
          }
          build_and_push src/CalCrony.Api/Dockerfile calcrony-api
          build_and_push src/CalCrony.Bot/Dockerfile calcrony-bot
          build_and_push src/CalCrony.Web/Dockerfile calcrony-web

  # Posts the release into the community server's #announcements with a real @Release Ping
  # mention — the GitHub-side Discord integration can't mention roles (issue #106). Lives in
  # this workflow for the same GITHUB_TOKEN reason as publish-images, and runs after it so
  # the ping lands once the images are actually pullable. Skips cleanly when the webhook
  # secret is unset.
  announce-release:
    needs: [release-please, publish-images]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_URL: ${{ needs.release-please.outputs.html_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASE_WEBHOOK secret not set; skipping announcement."
            exit 0
          fi
          # Role id of @Release Ping in the community server; ids are public, the webhook URL
          # is the secret. allowed_mentions pins the ping to exactly this role.
          role_id="1543943300132769802"
          jq -n \
            --arg content "<@&${role_id}> **CalCrony ${RELEASE_TAG}** just shipped — release notes: ${RELEASE_URL}" \
            --arg role "$role_id" \
            '{content: $content, allowed_mentions: {roles: [$role]}}' \
          | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
